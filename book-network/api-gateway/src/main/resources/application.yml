# =============================================================================
# API GATEWAY CONFIGURATION
# =============================================================================
# 엔터프라이즈급 API Gateway 설정
# Spring Cloud Gateway + Netflix OSS 최적화 구성

server:
  port: 8080 # API Gateway 표준 포트

spring:
  application:
    name: api-gateway
  
  # 프로파일별 환경 설정
  profiles:
    active: development
    
  # Spring Cloud Gateway 핵심 설정
  cloud:
    gateway:
      # 글로벌 CORS 설정
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      
      # 라우팅 규칙 정의
      routes:
        # 🧑‍💼 User Service 라우팅
        - id: user-service
          uri: lb://user-service # 로드 밸런싱
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=2 # /api/users -> /users
            - name: CircuitBreaker
              args:
                name: user-service-cb
                fallbackUri: forward:/fallback/user-service
            - name: Retry
              args:
                retries: 3
                methods: GET,POST
                exceptions: java.io.IOException,java.util.concurrent.TimeoutException
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20 # 초당 20개 토큰
                redis-rate-limiter.burstCapacity: 50 # 버스트 50개
                key-resolver: "#{@userKeyResolver}"
        
        # 📚 Book Service 라우팅
        - id: book-service
          uri: lb://book-service
          predicates:
            - Path=/api/books/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: book-service-cb
                fallbackUri: forward:/fallback/book-service
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50 # 읽기 중심 서비스
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@ipKeyResolver}"
        
        # 📖 Lending Service 라우팅
        - id: lending-service
          uri: lb://lending-service
          predicates:
            - Path=/api/lending/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: lending-service-cb
                fallbackUri: forward:/fallback/lending-service
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10 # 트랜잭션 서비스
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
        
        # 🤖 Recommendation Service 라우팅
        - id: recommendation-service
          uri: lb://recommendation-service
          predicates:
            - Path=/api/recommendations/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: recommendation-service-cb
                fallbackUri: forward:/fallback/recommendation-service
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 15
                redis-rate-limiter.burstCapacity: 30
                key-resolver: "#{@userKeyResolver}"
        
        # 🔔 Notification Service 라우팅
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: notification-service-cb
                fallbackUri: forward:/fallback/notification-service
        
        # 💬 Chat Service 라우팅
        - id: chat-service
          uri: lb://chat-service
          predicates:
            - Path=/api/chat/**,/ws/chat/**
          filters:
            - StripPrefix=1 # WebSocket 지원
            - name: CircuitBreaker
              args:
                name: chat-service-cb
                fallbackUri: forward:/fallback/chat-service
        
        # 📊 Analytics Service 라우팅
        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/analytics/**,/api/dashboard/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: analytics-service-cb
                fallbackUri: forward:/fallback/analytics-service
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userKeyResolver}"
      
      # 기본 필터 설정
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - name: Retry
          args:
            retries: 2
            methods: GET
        - AddRequestHeader=X-Gateway-Name,book-network-gateway
        - AddRequestHeader=X-Request-ID,#{T(java.util.UUID).randomUUID().toString()}
        - AddResponseHeader=X-Response-Time,#{T(System).currentTimeMillis()}
      
      # 서비스 디스커버리 설정
      discovery:
        locator:
          enabled: true # 자동 라우트 생성
          lower-case-service-id: true # 소문자 서비스 ID 사용
          include-expression: "serviceId.matches('.*-service')" # *-service 패턴만 포함
  
  # Redis 설정 (Rate Limiting용)
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5

# =============================================================================
# EUREKA CLIENT CONFIGURATION
# =============================================================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 30
  
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

# =============================================================================
# RESILIENCE4J CIRCUIT BREAKER CONFIGURATION
# =============================================================================
resilience4j:
  circuitbreaker:
    instances:
      user-service-cb:
        failure-rate-threshold: 50 # 50% 실패율 임계점
        wait-duration-in-open-state: 30s # OPEN 상태 유지 시간
        permitted-number-of-calls-in-half-open-state: 5 # HALF-OPEN 시 허용 요청 수
        sliding-window-size: 10 # 슬라이딩 윈도우 크기
        sliding-window-type: COUNT_BASED # 카운트 기반
        minimum-number-of-calls: 5 # 최소 호출 수
        
      book-service-cb:
        failure-rate-threshold: 60 # 읽기 서비스는 더 관대하게
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 10
        sliding-window-size: 20
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 5
        
      lending-service-cb:
        failure-rate-threshold: 40 # 트랜잭션 서비스는 더 엄격하게
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 5
        
      recommendation-service-cb:
        failure-rate-threshold: 70 # AI 서비스는 관대하게
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        sliding-window-size: 15
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 3
        
      notification-service-cb:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 5
        
      chat-service-cb:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 5
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 5
        
      analytics-service-cb:
        failure-rate-threshold: 80 # 분석 서비스는 가장 관대하게
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 5
        sliding-window-size: 20
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 3

  # 재시도 설정
  retry:
    instances:
      default:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - java.lang.IllegalArgumentException

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================
security:
  jwt:
    secret-key: ${JWT_SECRET_KEY:your-very-long-secret-key-that-should-be-at-least-256-bits}
    expiration: ${JWT_EXPIRATION:86400000} # 24 hours
  
  # 공개 엔드포인트 (인증 불필요)
  public-endpoints:
    - /api/users/register
    - /api/users/login
    - /api/books/search
    - /api/books/categories
    - /actuator/**
    - /fallback/**
  
  # 관리자 전용 엔드포인트
  admin-endpoints:
    - /api/analytics/**
    - /api/dashboard/admin/**
    - /actuator/gateway/**

# =============================================================================
# MONITORING & OBSERVABILITY
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway,circuitbreakers,retries
      base-path: /actuator
  
  endpoint:
    health:
      show-details: always
      show-components: always
    gateway:
      enabled: true # Gateway 라우트 정보 노출
    circuitbreakers:
      enabled: true
    retries:
      enabled: true
  
  # 헬스 체크 설정
  health:
    circuitbreakers:
      enabled: true
    redis:
      enabled: true
    
  # 메트릭 설정
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        resilience4j.circuitbreaker.calls: true
      sla:
        http.server.requests: 100ms,200ms,500ms,1s,2s

# =============================================================================
# DISTRIBUTED TRACING
# =============================================================================
spring.sleuth:
  sampler:
    probability: 1.0 # 100% 샘플링 (개발환경)
  zipkin:
    base-url: ${ZIPKIN_URL:http://localhost:9411}
  web:
    skip-pattern: "/actuator.*|/health.*|/favicon.*"

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.web.reactive: INFO
    org.springframework.security: INFO
    org.springframework.cloud.netflix.eureka: INFO
    reactor.netty: INFO
    io.github.resilience4j: INFO
    root: INFO
  
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
  
  file:
    name: logs/api-gateway.log
    max-size: 100MB
    max-history: 30

# =============================================================================
# APPLICATION INFO
# =============================================================================
info:
  app:
    name: Book Network API Gateway
    description: Enterprise-grade API Gateway with intelligent routing
    version: 1.0.0
    author: Book Network Team
  
  gateway:
    routes:
      user-service: /api/users/**
      book-service: /api/books/**
      lending-service: /api/lending/**
      recommendation-service: /api/recommendations/**
      notification-service: /api/notifications/**
      chat-service: /api/chat/**
      analytics-service: /api/analytics/**
  
  features:
    - Intelligent Routing
    - Load Balancing
    - Circuit Breaker
    - Rate Limiting
    - JWT Authentication
    - CORS Support
    - Distributed Tracing
    - Metrics Collection

---
# =============================================================================
# PRODUCTION PROFILE
# =============================================================================
spring:
  config:
    activate:
      on-profile: production

# 운영환경 최적화
management:
  tracing:
    sampling:
      probability: 0.1 # 10% 샘플링

# 더 엄격한 Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      lending-service-cb:
        failure-rate-threshold: 30 # 더 엄격
        wait-duration-in-open-state: 120s # 더 긴 대기
      user-service-cb:
        failure-rate-threshold: 40

# Rate Limiting 강화
spring.cloud.gateway.routes:
  - id: user-service-prod
    uri: lb://user-service
    predicates:
      - Path=/api/users/**
    filters:
      - name: RequestRateLimiter
        args:
          redis-rate-limiter.replenishRate: 10 # 운영환경에서는 더 제한적
          redis-rate-limiter.burstCapacity: 20

# 로깅 레벨 조정
logging:
  level:
    org.springframework.cloud.gateway: WARN
    root: WARN

---
# =============================================================================
# DEVELOPMENT PROFILE
# =============================================================================
spring:
  config:
    activate:
      on-profile: development

# 개발환경 편의 설정
management:
  endpoints:
    web:
      exposure:
        include: "*" # 모든 엔드포인트 노출

# 더 관대한 Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      default:
        failure-rate-threshold: 80 # 개발 시 더 관대하게
        wait-duration-in-open-state: 10s # 짧은 대기

# Rate Limiting 완화
spring.cloud.gateway:
  default-filters:
    - name: RequestRateLimiter
      args:
        redis-rate-limiter.replenishRate: 100 # 개발 시 여유롭게
        redis-rate-limiter.burstCapacity: 200

# 상세 로깅
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
    org.springframework.security: DEBUG