apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: book-network-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: book-network
    app.kubernetes.io/instance: dev
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: book-network-platform
    app.kubernetes.io/managed-by: argocd
    environment: development
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: book-network-dev
    notifications.argoproj.io/subscribe.on-sync-failed.slack: book-network-alerts
    notifications.argoproj.io/subscribe.on-health-degraded.slack: book-network-alerts
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: book-network
  
  # Source configuration
  source:
    repoURL: https://github.com/your-org/book-network
    path: helm/book-network
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
      parameters:
        - name: image.tag
          value: "1.0.0-dev"
        - name: replicaCount
          value: "2"
        - name: resources.requests.memory
          value: "256Mi"
        - name: resources.requests.cpu
          value: "250m"
        - name: resources.limits.memory
          value: "512Mi"
        - name: resources.limits.cpu
          value: "500m"
        - name: autoscaling.enabled
          value: "false"
        - name: postgresql.enabled
          value: "true"
        - name: redis.enabled
          value: "true"
        - name: monitoring.enabled
          value: "true"
        - name: ingress.hosts[0].host
          value: "book-network-dev.local"
  
  # Destination configuration
  destination:
    server: https://kubernetes.default.svc
    namespace: book-network-dev
  
  # Sync policy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  # Health check configuration
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: ConfigMap
      jsonPointers:
        - /data
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /spec/minReplicas
        - /spec/maxReplicas
  
  # Revision history
  revisionHistoryLimit: 10