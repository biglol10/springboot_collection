apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: book-network
  namespace: argocd
  labels:
    app.kubernetes.io/name: book-network-project
    app.kubernetes.io/component: project
    app.kubernetes.io/part-of: book-network-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/project-description: "Book Network Application Project"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Book Network microservices application project with multi-environment support"
  
  # Source repositories
  sourceRepos:
    - https://github.com/your-org/book-network
    - https://github.com/your-org/book-network-infrastructure
    - https://charts.bitnami.com/bitnami
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
  
  # Destination clusters and namespaces
  destinations:
    # Development environment
    - namespace: book-network-dev
      server: https://kubernetes.default.svc
      name: in-cluster
    # Staging environment  
    - namespace: book-network-staging
      server: https://kubernetes.default.svc
      name: in-cluster
    # Production environment
    - namespace: book-network-prod
      server: https://kubernetes.default.svc
      name: in-cluster
    # Monitoring namespace
    - namespace: monitoring
      server: https://kubernetes.default.svc
      name: in-cluster
    # System namespaces (limited access)
    - namespace: kube-system
      server: https://kubernetes.default.svc
      name: in-cluster
  
  # Cluster resource whitelist
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingAdmissionWebhook
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionWebhook
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: policy
      kind: PodSecurityPolicy
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: autoscaling.k8s.io
      kind: VerticalPodAutoscaler
  
  # Namespace resource whitelist
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Pod
    - group: apps
      kind: Deployment
    - group: apps
      kind: ReplicaSet
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: DaemonSet
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: policy
      kind: PodDisruptionBudget
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: autoscaling.k8s.io
      kind: VerticalPodAutoscaler
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: argoproj.io
      kind: Rollout
    - group: metrics.k8s.io
      kind: PodMetrics
  
  # Resource blacklist (explicitly denied)
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: extensions
      kind: NetworkPolicy  # Use networking.k8s.io version instead
  
  # Roles and permissions
  roles:
    # Developer role
    - name: developer
      description: "Developers can view and sync applications in dev environment"
      policies:
        - p, proj:book-network:developer, applications, get, book-network/*, allow
        - p, proj:book-network:developer, applications, sync, book-network/*-dev, allow
        - p, proj:book-network:developer, applications, action/*, book-network/*-dev, allow
        - p, proj:book-network:developer, logs, get, book-network/*-dev, allow
        - p, proj:book-network:developer, exec, create, book-network/*-dev, deny
      groups:
        - book-network:developers
        - your-org:developers
      
    # DevOps role
    - name: devops
      description: "DevOps can manage all applications and environments"
      policies:
        - p, proj:book-network:devops, applications, *, book-network/*, allow
        - p, proj:book-network:devops, repositories, *, *, allow
        - p, proj:book-network:devops, logs, get, book-network/*, allow
        - p, proj:book-network:devops, exec, create, book-network/*, allow
      groups:
        - book-network:devops
        - your-org:devops
        - your-org:platform-team
    
    # Production deployer role
    - name: prod-deployer
      description: "Can deploy to production environment with approval"
      policies:
        - p, proj:book-network:prod-deployer, applications, get, book-network/*, allow
        - p, proj:book-network:prod-deployer, applications, sync, book-network/*-prod, allow
        - p, proj:book-network:prod-deployer, applications, action/*, book-network/*-prod, deny
        - p, proj:book-network:prod-deployer, logs, get, book-network/*-prod, allow
      groups:
        - book-network:prod-deployers
        - your-org:release-managers
    
    # Read-only role
    - name: viewer
      description: "Read-only access to all applications"
      policies:
        - p, proj:book-network:viewer, applications, get, book-network/*, allow
        - p, proj:book-network:viewer, logs, get, book-network/*, allow
        - p, proj:book-network:viewer, applications, sync, book-network/*, deny
        - p, proj:book-network:viewer, applications, action/*, book-network/*, deny
      groups:
        - book-network:viewers
        - your-org:stakeholders
  
  # Sync windows
  syncWindows:
    # Allow syncing to dev environment anytime
    - kind: allow
      schedule: "* * * * *"
      duration: 24h
      applications:
        - book-network-dev
      namespaces:
        - book-network-dev
      clusters:
        - in-cluster
    
    # Allow syncing to staging during business hours
    - kind: allow
      schedule: "0 9-17 * * 1-5"  # 9 AM to 5 PM, Monday to Friday
      duration: 8h
      applications:
        - book-network-staging
      namespaces:
        - book-network-staging
      clusters:
        - in-cluster
    
    # Block production deployments during peak hours
    - kind: deny
      schedule: "0 12-14 * * 1-5"  # 12 PM to 2 PM, Monday to Friday
      duration: 2h
      applications:
        - book-network-prod
      namespaces:
        - book-network-prod
      clusters:
        - in-cluster
    
    # Allow production deployments during maintenance windows
    - kind: allow
      schedule: "0 2-4 * * 0"  # 2 AM to 4 AM on Sunday
      duration: 2h
      applications:
        - book-network-prod
      namespaces:
        - book-network-prod
      clusters:
        - in-cluster
    
    # Emergency production deployment window
    - kind: allow
      schedule: "0 20-22 * * *"  # 8 PM to 10 PM daily
      duration: 2h
      applications:
        - book-network-prod
      namespaces:
        - book-network-prod
      clusters:
        - in-cluster
      manualSync: true
  
  # Signature keys for verification
  signatureKeys:
    - keyID: pgp-key-id-here
  
  # Orphaned resources monitoring
  orphanedResources:
    warn: true
    ignore:
      - group: ""
        kind: ConfigMap
        name: kube-root-ca.crt
      - group: ""
        kind: Secret
        name: default-token-*