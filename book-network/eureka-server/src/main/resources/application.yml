# =============================================================================
# EUREKA SERVER CONFIGURATION
# =============================================================================
# 엔터프라이즈급 서비스 디스커버리 서버 설정
# Netflix OSS 패턴 기반 최적화된 구성

server:
  port: 8761 # Eureka 서버 표준 포트

spring:
  application:
    name: eureka-server
  
  # 프로파일별 환경 설정
  profiles:
    active: development
  
  # 보안 설정 (운영환경에서는 인증 활성화)
  security:
    user:
      name: ${EUREKA_USERNAME:admin}
      password: ${EUREKA_PASSWORD:admin123}
      roles: ADMIN

# =============================================================================
# EUREKA SERVER CORE CONFIGURATION
# =============================================================================
eureka:
  # 클라이언트 설정 (서버 자체도 클라이언트 역할)
  client:
    # 자기 자신을 레지스트리에 등록하지 않음 (단일 서버 모드)
    register-with-eureka: false
    # 다른 Eureka 서버에서 레지스트리 정보를 가져오지 않음
    fetch-registry: false
    # 서비스 URL 맵핑
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
    
    # 레지스트리 캐시 설정
    registry-fetch-interval-seconds: 30 # 레지스트리 정보 갱신 주기
    disable-delta: false # 델타 업데이트 사용 (성능 최적화)
    
  # 서버 인스턴스 설정
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
    prefer-ip-address: true # IP 주소 우선 사용
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    
    # 하트비트 설정 (기본값 최적화)
    lease-renewal-interval-in-seconds: 30 # 하트비트 전송 간격
    lease-expiration-duration-in-seconds: 90 # 하트비트 만료 시간
    
    # 상태 페이지 설정
    status-page-url-path: /actuator/info
    health-check-url-path: /actuator/health
    
  # 서버 레지스트리 설정
  server:
    # 자체 보호 모드 (네트워크 분할 상황 대응)
    enable-self-preservation: true
    self-preservation-threshold: 0.85 # 85% 임계점
    
    # 서비스 제거 설정
    eviction-interval-timer-in-ms: 60000 # 60초마다 만료된 서비스 제거
    
    # 응답 캐시 설정 (성능 최적화)
    response-cache-auto-expiration-in-seconds: 180
    response-cache-update-interval-ms: 30000
    
    # Delta 업데이트 보관 시간
    retention-time-in-m-s: 180000 # 3분
    
    # 동기화 설정
    sync-when-timestamp-differs: true
    
    # 레지스트리 초기화 대기 시간
    wait-time-in-ms-when-sync-empty: 0
    
    # 피어 노드 설정 (클러스터 모드용)
    peer-eureka-nodes-update-interval-ms: 600000 # 10분
    peer-eureka-status-refresh-time-interval-ms: 30000 # 30초

# =============================================================================
# MONITORING & OBSERVABILITY
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,eureka,env
      base-path: /actuator
  
  endpoint:
    health:
      show-details: always
      show-components: always
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  
  # 헬스 체크 설정
  health:
    defaults:
      enabled: true
    diskspace:
      enabled: true
      threshold: 100MB
    
  # 메트릭 설정
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
    
  # 추적 설정
  tracing:
    sampling:
      probability: 1.0 # 100% 추적 (개발환경)

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logging:
  level:
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
    org.springframework.cloud.netflix.eureka: INFO
    org.springframework.web: INFO
    root: INFO
  
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
  
  file:
    name: logs/eureka-server.log
    max-size: 100MB
    max-history: 30

# =============================================================================
# APPLICATION INFO
# =============================================================================
info:
  app:
    name: Book Network Service Discovery
    description: Enterprise-grade service registry and discovery server
    version: 1.0.0
    author: Book Network Team
  
  eureka:
    server:
      mode: standalone
      cluster: false
      protection: enabled
  
  build:
    timestamp: '@maven.build.timestamp@'
    version: '@project.version@'

---
# =============================================================================
# PRODUCTION PROFILE
# =============================================================================
spring:
  config:
    activate:
      on-profile: production

# 운영환경 최적화 설정
eureka:
  server:
    # 자체 보호 모드 강화
    enable-self-preservation: true
    self-preservation-threshold: 0.95 # 더 엄격한 임계점
    
    # 더 빠른 장애 감지
    eviction-interval-timer-in-ms: 30000 # 30초
    
    # 캐시 최적화
    response-cache-auto-expiration-in-seconds: 60
    response-cache-update-interval-ms: 15000
    
  instance:
    # 더 빠른 하트비트
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 45

# 로깅 레벨 조정
logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
    root: WARN

# 메트릭 샘플링 조정
management:
  tracing:
    sampling:
      probability: 0.1 # 10% 샘플링 (성능 고려)

---
# =============================================================================
# CLUSTER PROFILE (고가용성 클러스터 구성)
# =============================================================================
spring:
  config:
    activate:
      on-profile: cluster

eureka:
  client:
    # 클러스터 모드에서는 다른 Eureka 서버에 등록
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_PEER_NODES:http://eureka-1:8761/eureka/,http://eureka-2:8761/eureka/}
  
  server:
    # 클러스터 모드 최적화
    enable-self-preservation: true
    peer-eureka-nodes-update-interval-ms: 300000 # 5분
    sync-when-timestamp-differs: true
    wait-time-in-ms-when-sync-empty: 300000 # 5분 대기

---
# =============================================================================
# DEVELOPMENT PROFILE
# =============================================================================
spring:
  config:
    activate:
      on-profile: development

# 개발환경 편의 설정
eureka:
  server:
    # 자체 보호 모드 비활성화 (빠른 개발을 위해)
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000 # 5초 (빠른 테스트)
    
  instance:
    # 빠른 하트비트 (개발 편의)
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

# 상세 로깅
logging:
  level:
    com.netflix.eureka: DEBUG
    com.netflix.discovery: DEBUG
    org.springframework.cloud.netflix.eureka: DEBUG