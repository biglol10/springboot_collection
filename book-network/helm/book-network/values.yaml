# Default values for book-network
# This is a YAML-formatted file.

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Application configuration
replicaCount: 3

image:
  repository: book-network/app
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod Security Context
podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true

# Container Security Context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Service configuration
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: book-network.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: book-network-tls
      hosts:
        - book-network.local

# Resource management
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Horizontal Pod Autoscaler
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15

# Vertical Pod Autoscaler
vpa:
  enabled: false
  updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: book-network
      maxAllowed:
        cpu: 2000m
        memory: 2Gi
      minAllowed:
        cpu: 100m
        memory: 128Mi

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Node selection and affinity
nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - book-network
        topologyKey: kubernetes.io/hostname

# Health checks
healthchecks:
  livenessProbe:
    httpGet:
      path: /api/v1/actuator/health/liveness
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /api/v1/actuator/health/readiness
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startupProbe:
    httpGet:
      path: /api/v1/actuator/health/startup
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

# Environment variables
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "kubernetes"
  - name: JAVA_OPTS
    value: "-Xmx768m -Xms512m -XX:+UseG1GC -XX:+UseStringDeduplication"

# Configuration from ConfigMap
configMap:
  enabled: true
  data:
    application.yaml: |
      spring:
        application:
          name: book-network
        datasource:
          url: jdbc:postgresql://book-network-postgresql:5432/book_social_network
          username: ${DB_USERNAME}
          password: ${DB_PASSWORD}
        data:
          redis:
            host: book-network-redis-master
            port: 6379
            password: ${REDIS_PASSWORD}
        jpa:
          hibernate:
            ddl-auto: validate
          show-sql: false
        cache:
          type: redis
      
      management:
        endpoints:
          web:
            exposure:
              include: health,info,metrics,prometheus
        endpoint:
          health:
            show-details: when-authorized
        metrics:
          export:
            prometheus:
              enabled: true
        tracing:
          sampling:
            probability: 0.1
      
      logging:
        level:
          com.alibou.booknetwork: INFO
          org.springframework: WARN
        pattern:
          console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Secrets
secrets:
  enabled: true
  data:
    DB_USERNAME: "Ym9va25ldHdvcms="  # booknetwork (base64)
    DB_PASSWORD: "cGFzc3dvcmQxMjM="  # password123 (base64)
    REDIS_PASSWORD: "cmVkaXNwYXNz"     # redispass (base64)
    JWT_SECRET: "anlXdFNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uQW5kQXV0aG9yaXphdGlvbg=="

# Persistent Volumes
persistence:
  uploads:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    annotations: {}
  logs:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi
    annotations: {}

# Database configuration (PostgreSQL)
postgresql:
  enabled: true
  auth:
    enablePostgresUser: true
    postgresPassword: "postgres123"
    username: "booknetwork"
    password: "password123"
    database: "book_social_network"
  architecture: standalone
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi

# Redis configuration
redis:
  enabled: true
  auth:
    enabled: true
    password: "redispass"
  architecture: standalone
  master:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

# Monitoring configuration
monitoring:
  enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
  grafana:
    enabled: true
    adminPassword: "admin123"
    dashboards:
      enabled: true
  jaeger:
    enabled: true
    collector:
      service:
        type: ClusterIP

# Network Policies
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx
      ports:
      - protocol: TCP
        port: 8080
  egress:
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 5432  # PostgreSQL
      - protocol: TCP
        port: 6379  # Redis
      - protocol: TCP
        port: 53    # DNS
      - protocol: UDP
        port: 53    # DNS

# Backup configuration
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: "7d"
  storage:
    type: "s3"
    bucket: "book-network-backups"
    region: "us-east-1"

# Migration jobs
migration:
  enabled: true
  image:
    repository: book-network/migrations
    tag: "1.0.0"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Init containers
initContainers:
  dbMigration:
    enabled: true
    image:
      repository: migrate/migrate
      tag: "v4.15.2"
    command:
      - migrate
      - -path
      - /migrations
      - -database
      - "postgres://$(DB_USERNAME):$(DB_PASSWORD)@book-network-postgresql:5432/book_social_network?sslmode=disable"
      - up

# Sidecar containers
sidecars:
  logRotation:
    enabled: true
    image:
      repository: busybox
      tag: "1.35"
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          find /app/logs -name "*.log" -mtime +7 -delete
          sleep 3600
        done
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

# Testing
testing:
  enabled: false
  image:
    repository: book-network/tests
    tag: "1.0.0"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi