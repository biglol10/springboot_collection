# =============================================================================
# API Gateway Kubernetes 배포 구성
# =============================================================================
# 고가용성 및 자동 스케일링을 지원하는 Gateway 배포

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: book-network
  labels:
    app: api-gateway
    component: gateway
    tier: frontend
    version: v1.0.0
spec:
  replicas: 3 # 고가용성을 위한 최소 3개 인스턴스
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        component: gateway
        tier: frontend
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: api-gateway
        image: book-network/api-gateway:1.0.0
        ports:
        - containerPort: 8080
          name: http
        
        # 환경 변수 설정
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "kubernetes,production"
        - name: EUREKA_SERVER
          value: "http://eureka-server:8761/eureka"
        - name: CONFIG_SERVER
          value: "http://config-server:8888"
        - name: REDIS_HOST
          value: "redis-cluster"
        - name: REDIS_PORT
          value: "6379"
        - name: ZIPKIN_URL
          value: "http://zipkin-server:9411"
        
        # 보안 설정 (Secret에서 로드)
        envFrom:
        - secretRef:
            name: api-gateway-secrets
        
        # 리소스 제한
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        
        # 헬스체크 설정
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # 시작 프로브 (느린 시작 대응)
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30 # 최대 5분 대기
        
        # 보안 컨텍스트
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        
        # 볼륨 마운트
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: config
          mountPath: /app/config
          readOnly: true
      
      # 볼륨 정의
      volumes:
      - name: logs
        emptyDir: {}
      - name: config
        configMap:
          name: api-gateway-config
      
      # 파드 스케줄링 설정
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - api-gateway
              topologyKey: kubernetes.io/hostname
      
      # 우아한 종료 설정
      terminationGracePeriodSeconds: 30

---
# API Gateway Service 정의
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: book-network
  labels:
    app: api-gateway
    component: gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: api-gateway

---
# API Gateway HPA (Horizontal Pod Autoscaler)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: book-network
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # 5분 안정화
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60 # 1분 안정화
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60

---
# API Gateway ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: book-network
data:
  application.yml: |
    server:
      port: 8080
    spring:
      application:
        name: api-gateway
      profiles:
        active: kubernetes,production
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      health:
        probes:
          enabled: true

---
# API Gateway Secret
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
  namespace: book-network
type: Opaque
data:
  # Base64 인코딩된 값들 (실제 배포시 암호화)
  JWT_SECRET_KEY: eW91ci1qd3Qtc2VjcmV0LWtleS0yMDI0 # your-jwt-secret-key-2024
  REDIS_PASSWORD: cmVkaXMtcGFzc3dvcmQ= # redis-password