# =============================================================================
# ZIPKIN 분산 추적 시스템 Docker Compose
# =============================================================================
# Zipkin + Elasticsearch + MySQL 통합 구성
# 엔터프라이즈급 추적 데이터 수집 및 분석 환경

version: '3.8'

services:
  # =============================================================================
  # ZIPKIN SERVER - 분산 추적 수집 및 UI
  # =============================================================================
  zipkin-server:
    image: openzipkin/zipkin:2.24
    container_name: book-network-zipkin
    restart: unless-stopped
    
    # 포트 설정
    ports:
      - "9411:9411" # Zipkin UI 및 API
    
    # 환경 변수 설정
    environment:
      # 저장소 설정 (MySQL 사용)
      - STORAGE_TYPE=mysql
      - MYSQL_HOST=zipkin-mysql
      - MYSQL_TCP_PORT=3306
      - MYSQL_DB=zipkin
      - MYSQL_USER=zipkin
      - MYSQL_PASS=zipkin123
      - MYSQL_USE_SSL=false
      
      # 성능 최적화
      - JAVA_OPTS=-Xms512m -Xmx1024m
      - ZIPKIN_LOG_LEVEL=INFO
      
      # UI 설정
      - ZIPKIN_UI_CONFIG_json={"defaultLookback":86400000,"searchEnabled":true}
      
      # 샘플링 설정
      - ZIPKIN_STORAGE_AUTOCOMPLETE_KEYS=serviceName,spanName,tagKey,tagValue
      - ZIPKIN_STORAGE_AUTOCOMPLETE_TTL=3600000
      - ZIPKIN_STORAGE_AUTOCOMPLETE_CARDINALITY=20000
      
      # Collector 설정
      - COLLECTOR_SAMPLE_RATE=1.0 # 100% 수집 (개발환경)
      - ZIPKIN_COLLECTOR_ACTIVEMQ_ENABLED=false
      - ZIPKIN_COLLECTOR_KAFKA_ENABLED=true
      - ZIPKIN_COLLECTOR_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ZIPKIN_COLLECTOR_KAFKA_TOPIC=zipkin
      
    # 의존성 설정
    depends_on:
      - zipkin-mysql
      - kafka
    
    # 헬스체크 설정
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9411/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 네트워크 설정
    networks:
      - book-network

  # =============================================================================
  # MYSQL - Zipkin 데이터 영구 저장
  # =============================================================================
  zipkin-mysql:
    image: mysql:8.0
    container_name: book-network-zipkin-mysql
    restart: unless-stopped
    
    # 포트 설정
    ports:
      - "3307:3306" # 메인 MySQL과 포트 충돌 방지
    
    # 환경 변수 설정
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=zipkin
      - MYSQL_USER=zipkin
      - MYSQL_PASSWORD=zipkin123
      
    # MySQL 설정 최적화
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --innodb-log-file-size=64M
      --max-connections=200
      --thread-cache-size=16
      --table-open-cache=64
      --tmp-table-size=64M
      --max-heap-table-size=64M
      --query-cache-size=0
      --query-cache-type=0
      --innodb-flush-method=O_DIRECT
      --innodb-flush-log-at-trx-commit=1
      --sync-binlog=1
    
    # 볼륨 설정 (데이터 영속성)
    volumes:
      - zipkin_mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d # 초기화 스크립트
      - ./mysql/conf:/etc/mysql/conf.d # 설정 파일
    
    # 헬스체크 설정
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "zipkin", "-pzipkin123"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    
    # 네트워크 설정
    networks:
      - book-network

  # =============================================================================
  # ELASTICSEARCH - 검색 및 분석 (선택사항)
  # =============================================================================
  zipkin-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: book-network-zipkin-elasticsearch
    restart: unless-stopped
    
    # 포트 설정
    ports:
      - "9200:9200"
      - "9300:9300"
    
    # 환경 변수 설정
    environment:
      - discovery.type=single-node
      - cluster.name=zipkin-cluster
      - node.name=zipkin-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.monitoring.enabled=false
      - xpack.watcher.enabled=false
      - xpack.ml.enabled=false
      - action.destructive_requires_name=false
      
    # 메모리 설정
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    
    # 볼륨 설정
    volumes:
      - zipkin_elasticsearch_data:/usr/share/elasticsearch/data
    
    # 헬스체크 설정
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    # 네트워크 설정
    networks:
      - book-network

  # =============================================================================
  # KAFKA - 비동기 추적 데이터 수집
  # =============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: book-network-zookeeper
    restart: unless-stopped
    
    # 포트 설정
    ports:
      - "2181:2181"
    
    # 환경 변수 설정
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
    
    # 볼륨 설정
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    
    # 네트워크 설정
    networks:
      - book-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: book-network-kafka
    restart: unless-stopped
    
    # 포트 설정
    ports:
      - "9092:9092"
      - "29092:29092"
    
    # 환경 변수 설정
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      
      # 성능 최적화
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_LOG_RETENTION_HOURS: 168 # 7일
      KAFKA_LOG_SEGMENT_BYTES: 1073741824 # 1GB
      KAFKA_LOG_RETENTION_BYTES: 1073741824 # 1GB
      
    # 의존성 설정
    depends_on:
      - zookeeper
    
    # 볼륨 설정
    volumes:
      - kafka_data:/var/lib/kafka/data
    
    # 헬스체크 설정
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    # 네트워크 설정
    networks:
      - book-network

  # =============================================================================
  # GRAFANA - 추적 데이터 시각화 (선택사항)
  # =============================================================================
  grafana:
    image: grafana/grafana:9.4.7
    container_name: book-network-grafana
    restart: unless-stopped
    
    # 포트 설정
    ports:
      - "3001:3000" # 포트 충돌 방지
    
    # 환경 변수 설정
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_LOG_LEVEL=info
    
    # 볼륨 설정
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    
    # 의존성 설정
    depends_on:
      - zipkin-server
      - zipkin-elasticsearch
    
    # 네트워크 설정
    networks:
      - book-network

  # =============================================================================
  # JAEGER - 대안 추적 시스템 (선택사항)
  # =============================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.42
    container_name: book-network-jaeger
    restart: unless-stopped
    
    # 포트 설정
    ports:
      - "16686:16686" # Jaeger UI
      - "14268:14268" # HTTP collector
      - "14250:14250" # gRPC collector
    
    # 환경 변수 설정
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9412
      - SPAN_STORAGE_TYPE=elasticsearch
      - ES_SERVER_URLS=http://zipkin-elasticsearch:9200
      - ES_USERNAME=
      - ES_PASSWORD=
    
    # 의존성 설정
    depends_on:
      - zipkin-elasticsearch
    
    # 네트워크 설정
    networks:
      - book-network

# =============================================================================
# 네트워크 설정
# =============================================================================
networks:
  book-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# =============================================================================
# 볼륨 설정 (데이터 영속성)
# =============================================================================
volumes:
  zipkin_mysql_data:
    driver: local
  zipkin_elasticsearch_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka_data:
    driver: local
  grafana_data:
    driver: local